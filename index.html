<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning formateurs</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script src="config.js"></script></head>
<body><main id="app"></main><script>
// Page formateurs (lecture seule). Le code est vérifié côté serveur à chaque appel (voir supabase.sql).
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), app=document.getElementById('app');
let code=sessionStorage.code||'', fid=sessionStorage.fid||'', jour=iso(new Date());
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function decaler(n){const d=new Date(jour+'T12:00');d.setDate(d.getDate()+n);jour=iso(d);go()}
function msg(t){app.innerHTML=`<div class="card h">${t}</div><button class="sec" onclick="sessionStorage.clear();location.reload()">Retour</button>`}
function erreur(e){const m=e.message||'';
  if(m.includes('ferme'))return msg('Planning fermé pour le moment.');
  if(m.includes('desactive'))return msg('Votre accès est désactivé.');
  if(m.includes('code')){sessionStorage.clear();code='';return ecranCode('Code incorrect')}
  msg('Erreur de connexion.')}
function ecranCode(err=''){app.innerHTML=`<h1>Planning</h1><p class="warn" ${err?'':'hidden'}>${err}</p>
 <input id="c" type="password" placeholder="Code d'accès" style="width:100%;box-sizing:border-box"><button onclick="valider()" style="width:100%">Entrer</button>`}
async function valider(){code=document.getElementById('c').value;sessionStorage.code=code;go()}
async function go(){
  if(!code)return ecranCode();
  if(!fid){const{data,error}=await sb.rpc('liste_formateurs',{p_code:code});if(error)return erreur(error);
    app.innerHTML='<h1>Qui êtes-vous ?</h1>'+data.map(f=>`<button style="width:100%;font-size:1.3em;${f.actif?'':'opacity:.4'}" ${f.actif?'':'disabled'} onclick="fid='${f.id}';sessionStorage.fid=fid;go()">${f.nom}</button>`).join('');return}
  const{data,error}=await sb.rpc('planning_jour',{p_code:code,p_formateur:fid,p_jour:jour});
  if(error){if(error.message.includes('desactive')){sessionStorage.removeItem('fid');fid=''}return erreur(error)}
  const auj=iso(new Date()),lib=new Date(jour+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  app.innerHTML=`<div class="nav"><button onclick="decaler(-1)">◀ Hier</button><button onclick="jour=iso(new Date());go()">Aujourd'hui</button><button onclick="decaler(1)">Demain ▶</button>
   <input type="date" value="${jour}" onchange="jour=this.value;go()"></div><h1>${lib}</h1>`+
   (data.length?data.map(c=>{const ty=[c.est_formation&&'Formation '+c.nature_formation,c.est_test&&'Test '+c.nature_test].filter(Boolean).join(' + ');
    return `<div class="card ${c.est_test&&!c.est_formation?'test':''} ${c.formateur_id==fid?'moi':''}"><div class="h">${c.debut.slice(0,5)} – ${c.fin.slice(0,5)} · ${c.famille}</div>
    <div>${ty} · <b>${c.salle||'—'}</b> · ${c.formateur||'—'}</div><div>${c.stagiaires.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>`}).join(''):'<p>Aucun créneau ce jour.</p>')+
   `<button class="sec" onclick="sessionStorage.removeItem('fid');fid='';go()">Changer de formateur</button>`}
// Temps réel : tout changement incrémente "signal" => on recharge le jour affiché
sb.channel('ping').on('postgres_changes',{event:'*',schema:'public',table:'signal'},()=>{if(code)go()}).subscribe();
go();
</script></body></html>

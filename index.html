<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning formateurs</title><link rel="stylesheet" href="style.css?v=40">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script src="config.js"></script></head>
<body><main id="app"></main><script>
// Page formateurs (lecture seule). Rien n'est affiché tant qu'un nom n'est pas touché ; le code est vérifié côté serveur.
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), app=document.getElementById('app');
let msgOn=false,msgLu=null,msgPin='',msgErr='',msgFid='',consJ=[],modifs=[],acces={stagiaires:true,charge:false,futures:false},code=sessionStorage.code||'', fid='', jour=iso(new Date()), vue='plan';   // fid volontairement NON mémorisé : écran vide à l'ouverture
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const FC={R482:'#ea580c',R484:'#2563eb',R485:'#16a34a',R486:'#9333ea',R489:'#dc2626',R490:'#0891b2'};   // couleur par famille
// Badges de nature : libellé complet + icône + couleur (orange = PRATIQUE, bleu = THÉORIE)
const natB=n=>n=='Théorie'?'<span class="bd theo"><span class="ic">📖</span>THÉORIE</span>':n=='Pratique'?'<span class="bd pra"><span class="ic">🔧</span>PRATIQUE</span>':'';
// Formation / Test : bandeau pleine largeur, très distinct (FORMATION = bandeau noir plein, TEST = bandeau blanc hachuré à gros cadre) ; la nature (théorie / pratique) est dans le bandeau
const natT=n=>n=='Théorie'?'📖 THÉORIE':n=='Pratique'?'🔧 PRATIQUE':'';
const bandeauT=(k,n,t)=>`<div class="bt ${k=='F'?'btf':'btt'}"><span class="bl">${k=='F'?'📘 FORMATION':'📝 TEST'}</span>${n?`<span class="bn">${natT(n)}</span>`:''}${t?`<span class="bh">${t}</span>`:''}</div>`;
const typeB=(c,t)=>{let h=t;return [c.est_formation&&bandeauT('F',c.nature_formation,h,h=''),c.est_test&&bandeauT('T',c.nature_test,h)].filter(Boolean).join('')};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function decaler(n){const d=new Date(jour+'T12:00');d.setDate(d.getDate()+n);jour=iso(d);go()}
function msg(t){app.innerHTML=`<div class="card h">${t}</div><button class="sec" onclick="sessionStorage.clear();location.reload()">Retour</button>`}
function erreur(e){const m=e.message||'';
  if(m.includes('ferme'))return msg('Planning fermé pour le moment.');
  if(m.includes('desactive'))return msg('Ce planning est désactivé.');
  if(m.includes('code')){sessionStorage.clear();code='';return ecranCode('Code incorrect')}
  msg('Erreur de connexion.')}
function ecranCode(err=''){app.innerHTML=`<h1>Planning</h1><p class="warn" ${err?'':'hidden'}>${err}</p>
 <input id="c" type="password" placeholder="Code d'accès" style="width:100%;box-sizing:border-box"><button onclick="code=document.getElementById('c').value;sessionStorage.code=code;go()" style="width:100%">Entrer</button>`}
async function go(){
  if(!code)return ecranCode();
  const l=await sb.rpc('liste_formateurs',{p_code:code});if(l.error)return erreur(l.error);
  const noms=l.data.map(f=>`<button class="${f.id==fid?'':'sec'}" style="font-size:1.2em;${f.actif?'':'opacity:.4'}" ${f.actif?'':'disabled'} onclick="fid='${f.id}';go()">${f.nom}</button>`).join('');
  if(!fid){app.innerHTML=`<h1>Choisissez un formateur</h1>${noms}`;return}
  {const a=await sb.rpc('acces_vues',{p_code:code,p_formateur:fid});acces=(a.error||!a.data)?{stagiaires:true,charge:false,futures:false}:a.data;if((vue=='stag'&&!acces.stagiaires)||(vue=='charge'&&!acces.charge))vue='plan'}
  {const m=await sb.rpc('planning_modifs_liste',{p_code:code,p_formateur:fid});modifs=(m.error||!m.data)?[]:m.data}   // changements de planning non lus (bandeau 🔄)
  if(msgFid!==fid){msgLu=null;msgPin='';msgErr='';msgFid=fid}      // jamais de message d'un autre formateur à l'écran
  {const m=await sb.rpc('message_present',{p_code:code,p_formateur:fid});msgOn=!m.error&&m.data===true}   // message privé en attente (✉)
  {const t=iso(new Date()),ds=[0,1,2,3,4,5,6].map(k=>addj(t,k)).filter(d=>acces.futures||!futur(d)),r=await Promise.all(ds.map(async d=>{const p=await sb.rpc('planning_jour',{p_code:code,p_formateur:fid,p_jour:d});return{d,n:(p.error||!p.data)?0:p.data.filter(c=>c.consigne).length}}));consJ=r.filter(x=>x.n>0)}   // consignes des 7 prochains jours, signalées sur tous les onglets
  if(vue=='stag')return vueStag(noms);if(vue=='charge')return vueCharge(noms);
  if(!acces.futures&&futur(jour))return ferme(noms,navJ());
  const{data,error}=await sb.rpc('planning_jour',{p_code:code,p_formateur:fid,p_jour:jour});if(error){if((error.message||'').includes('semaine_future'))return ferme(noms,navJ());fid='';return erreur(error)}
  // Charge du jour (règles : 6 UT pratique, 7 UT total, 12 candidats par session de théorie) ; affichée en rouge si dépassée
  const ch=(await sb.rpc('charge_jour',{p_code:code,p_formateur:fid,p_jour:jour})).data,u=n=>String(Math.round(n*100)/100).replace('.',',');
  const bandeau=ch?(()=>{const m=[],ss=ch.sessions||[];if(ch.tot>ch.max_total)m.push(`${u(ch.tot)} UT programmées, limite ${u(ch.max_total)}`);if(ch.pra>ch.max_pratique)m.push(`${u(ch.pra)} UT de pratique, limite ${u(ch.max_pratique)}`);
   ss.forEach(x=>m.push(`Session de théorie ${x.famille} (${String(x.debut).slice(0,5)}) : ${x.nb} candidats, limite ${ch.max_candidats}`));
   return (m.length?`<div class="warn" style="font-size:1.1em;border:3px solid #b91c1c;padding:10px;margin:8px 0"><b>⚠ ATTENTION – LIMITE DÉPASSÉE</b><br>${m.join('<br>')}</div>`:'')+(ch.tot>0?`<p><b>Charge du jour :</b> ${u(ch.tot)} / ${u(ch.max_total)} UT, dont pratique ${u(ch.pra)} / ${u(ch.max_pratique)} UT</p>`:'')})():'';
  const lib=new Date(jour+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  app.innerHTML=`<div>${noms}</div>${onglets()}<div class="nav"><button onclick="decaler(-1)">◀ Hier</button><button onclick="jour=iso(new Date());go()">Aujourd'hui</button><button onclick="decaler(1)">Demain ▶</button>
   <input type="date" value="${jour}" onchange="jour=this.value;go()"></div><h1>${lib}</h1>${bandeau}`+
   (data.length?data.map(c=>{
    if(c.div){const sd=c.stagiaires.map(x=>{const m=x.match(/^(.*?)(?: \(([^)]*)\))?$/);return{n:m[1],e:m[2]||''}});
     return `<div class="card crf" style="border-left-color:#475569"><div class="bt btd"><span class="bl">🎓 FORMATION DIVERSE</span><span class="bh">${c.horaire?c.horaire.replace(/–/g,' – ').replace(' + ',' &nbsp;·&nbsp; '):c.debut.slice(0,5)+' – '+c.fin.slice(0,5)}</span></div><div class="crl"><span class="cb" style="margin-left:0">${esc(c.div)}</span></div>${c.chez_client?`<div style="border:2px solid #000;border-radius:8px;padding:6px 8px;margin:8px 0"><b>🏢 CHEZ LE CLIENT</b>${c.lieu?' : '+esc(c.lieu):''}</div>`:`<div style="border:2px solid #000;border-radius:8px;padding:6px 8px;margin:8px 0"><b>🏫 CENTRE DE FORMATION WANTZ</b>${c.salle?' — '+esc(c.salle):''}</div>`}<div class="cands">${sd.map(x=>`<span class="tag">${esc(x.n)}${x.e?`<span class="sc">${esc(x.e)}</span>`:''}</span>`).join('')||'<small>Aucun inscrit pour le moment.</small>'}</div>${c.consigne?`<div class="consigne"><b>📌 CONSIGNE :</b> ${esc(c.consigne)}</div>`:''}</div>`}
    const st=c.stagiaires.map(x=>{const m=x.match(/^(.*?)(?: \(([^)]*)\))?$/);return{n:m[1],c:m[2]?m[2].split(', '):[]}}),cats=c.categorie?[c.categorie]:[...new Set(st.flatMap(x=>x.c))];
    const hr=c.debut.slice(0,5)+' – '+c.fin.slice(0,5),bd=typeB(c,hr);
    return `<div class="card crf" style="border-left-color:${FC[c.famille]}">${bd||`<div class="h">${hr}</div>`}
    <div class="crl"><span class="fb" style="background:${FC[c.famille]}">${c.famille}</span>${cats.length?`<span class="cb">Catégorie ${esc(cats.join(' · '))}</span>`:''}</div>
    ${c.salle?'<div style="margin:8px 2px">📍 <b>'+esc(c.salle)+'</b></div>':''}${c.previsionnel?'<div style="border:2px dashed #000;border-radius:8px;padding:6px 8px;margin:6px 0"><b>🗓 Créneau prévisionnel</b> — candidats à confirmer</div>':''}<div class="cands">${st.map(x=>`<span class="tag">${esc(x.n)}${x.c.map(k=>`<span class="sc">Cat. ${esc(k)}</span>`).join('')}</span>`).join('')}</div>${c.consigne?`<div class="consigne"><b>📌 CONSIGNE :</b> ${esc(c.consigne)}</div>`:''}</div>`}).join(''):'<p>Aucun créneau ce jour.</p>')}
// ---- Vue globale des stagiaires (lecture seule, même présentation que l'impression admin) + coche « présent » ----
const FAMS=['R482','R484','R485','R486','R489','R490'],JN=['Lun','Mar','Mer','Jeu','Ven'];
const lblJ=d=>{const t=iso(new Date());return d==t?"Aujourd'hui":d==addj(t,1)?'Demain':new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'numeric'})};
const onglets=()=>{const tot=consJ.reduce((a,x)=>a+x.n,0);
 return `<div class="nav"><button class="${vue=='plan'?'':'sec'}" onclick="vue='plan';go()">📅 Planning du jour${tot?` &nbsp;📌 ${tot}`:''}${modifs.length?` &nbsp;🔄 ${modifs.length}`:''}</button>${acces.stagiaires?`<button class="${vue=='stag'?'':'sec'}" onclick="vue='stag';go()">👥 Stagiaires de la semaine</button>`:''}${acces.charge?`<button class="${vue=='charge'?'':'sec'}" onclick="vue='charge';go()">🎨 Charge testeurs</button>`:''}</div>`+
 (tot?`<div style="border:4px solid #000;border-radius:8px;background:#fff7d6;padding:8px 10px;margin:8px 0"><b>📌 Consignes à lire :</b> ${consJ.map(x=>`<button class="${vue=='plan'&&jour==x.d?'':'sec'}" style="margin:3px" onclick="vue='plan';jour='${x.d}';go()">${lblJ(x.d)} · ${x.n}</button>`).join('')}</div>`:'')+bandeauModifs()+bandeauMsg()};
// Bandeau ✉ « MESSAGE » (cadre pointillé épais, fond rose) : visible uniquement sur la page de ce formateur ; le texte n'est lisible qu'avec son code personnel à 4 chiffres
function bandeauMsg(){if(!msgOn&&!msgLu)return '';const bx='border:4px dotted #000;border-radius:8px;background:#fce7f3;padding:10px;margin:8px 0';
 if(msgLu)return `<div style="${bx}"><b>✉ MESSAGE :</b>${msgLu.map(m=>`<div style="margin:8px 0;padding:8px;background:#fff;border:2px solid #000;border-radius:6px;white-space:pre-wrap">${esc(m.texte)}</div>`).join('')}<button onclick="vuMsg()" style="width:100%">✔ J'ai lu</button></div>`;
 return `<div style="${bx}"><b>✉ UN MESSAGE VOUS ATTEND</b> — entrez votre code personnel (4 chiffres) pour le lire.${msgErr?`<p class="warn" style="margin:6px 0"><b>${esc(msgErr)}</b></p>`:''}
  <div style="display:flex;gap:8px;margin-top:6px"><input id="mp" type="password" inputmode="numeric" maxlength="4" placeholder="Code personnel" style="flex:1;box-sizing:border-box"><button onclick="lireMsg()">Lire</button></div></div>`}
async function lireMsg(){const pin=(document.getElementById('mp')||{}).value||'';const r=await sb.rpc('message_lire',{p_code:code,p_formateur:fid,p_pin:pin});
 if(r.error){const m=r.error.message||'';msgErr=m.includes('pas_de_code')?"Aucun code personnel n'est encore défini pour vous : demandez-le à l'administrateur.":m.includes('code_invalide')?'Code incorrect.':'Lecture impossible : '+m;msgLu=null}else{msgLu=r.data;msgPin=pin;msgErr=''}go()}
async function vuMsg(){const r=await sb.rpc('message_vu',{p_code:code,p_formateur:fid,p_pin:msgPin,p_ids:(msgLu||[]).map(x=>x.id)});if(r.error){msgErr='Impossible de valider : '+r.error.message;msgLu=null}else{msgLu=null;msgPin='';msgOn=false;msgErr=''}go()}
// Bandeau 🔄 « PLANNING MODIFIÉ » (double cadre bleu) : différent du bandeau 📌 des consignes (cadre noir épais, jaune). Disparaît au clic sur « J'ai pris connaissance ».
function bandeauModifs(){if(!modifs.length)return '';const g={};modifs.forEach(m=>(g[m.jour]=g[m.jour]||[]).push(m));
 const gl={ajout:'➕ AJOUTÉ',modif:'✎ MODIFIÉ',suppr:'✖ SUPPRIMÉ'};
 return `<div style="border:4px double #000;border-radius:8px;background:#e0f2fe;padding:8px 10px;margin:8px 0"><b>🔄 PLANNING MODIFIÉ — changements depuis votre dernière lecture :</b>${Object.keys(g).sort().map(d=>`<div style="margin:5px 0"><button class="${vue=='plan'&&jour==d?'':'sec'}" style="margin:2px" onclick="vue='plan';jour='${d}';go()">${lblJ(d)}</button> ${g[d].map(m=>`<span style="white-space:nowrap"><b>${gl[m.genre]||''}</b> ${esc(m.resume||'')}</span>`).join(' · ')}</div>`).join('')}<button style="margin-top:6px" onclick="vuModifs()">✔ J'ai pris connaissance</button></div>`}
async function vuModifs(){await sb.rpc('planning_modifs_vu',{p_code:code,p_formateur:fid});modifs=[];go()}
// Semaines à venir : masquées tant que l'admin ne les ouvre pas (la semaine en cours et le passé restent visibles)
const futur=d=>d>addj(lundiDe(iso(new Date())),6);
const navJ=()=>`<div class="nav"><button onclick="decaler(-1)">◀ Hier</button><button onclick="jour=iso(new Date());go()">Aujourd'hui</button><button onclick="decaler(1)">Demain ▶</button><input type="date" value="${jour}" onchange="jour=this.value;go()"></div>`;
const navS=()=>`<div class="nav"><button onclick="decaler(-7)">◀ Semaine préc.</button><button onclick="jour=iso(new Date());go()">Cette semaine</button><button onclick="decaler(7)">Semaine suiv. ▶</button></div>`;
const ferme=(noms,nav)=>{app.innerHTML=`<div>${noms}</div>${onglets()}${nav}<div class="card" style="border:3px dashed #000"><b>🔒 Cette période n'est pas encore ouverte.</b><br>Seule la semaine en cours (et les semaines passées) est consultable pour le moment.</div>`};
const addj=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const lundiDe=s=>addj(s,-((new Date(s+'T12:00').getDay()+6)%7));
const fr=d=>d?d.split('-').reverse().join('/').slice(0,5):'—';
async function vueStag(noms){const lun=lundiDe(jour),ven=addj(lun,4);if(!acces.futures&&futur(lun))return ferme(noms,navS());
  const{data,error}=await sb.rpc('stagiaires_semaine',{p_code:code,p_formateur:fid,p_lundi:lun});if(error){if((error.message||'').includes('semaine_future'))return ferme(noms,navS());if((error.message||'').includes('vue_fermee')){vue='plan';return go()}if((error.message||'').includes('stagiaires_semaine'))return msg('Fonction manquante : exécuter migration_v10.sql dans Supabase.');fid='';return erreur(error)}
  const T=data.today,rows=[...data.rows].sort((a,b)=>(a.date_fin||'9').localeCompare(b.date_fin||'9')||(a.nom||'').localeCompare(b.nom||'')),enPlace=(s,d)=>s.date_debut&&d>=s.date_debut&&(!s.date_fin||d<=s.date_fin)&&((s.programme||{})[d]||s.type)!='Absent';
  const auj=T>=lun&&T<=ven,att=auj?rows.filter(s=>enPlace(s,T)):[],pres=att.filter(s=>s.present).length;
  const hh=s=>s.present_a?new Date(s.present_a).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
  const CG='<colgroup><col style="width:34%"><col style="width:22%"><col style="width:8%"><col style="width:16%"><col style="width:10%"><col style="width:10%"></colgroup>';
  const tabs=FAMS.map(f=>{const l=rows.filter(s=>s.famille==f);if(!l.length)return '';let pf;
   return `<h3>${f}</h3><div class="tw"><table class="fam cp" style="--fc:${FC[f]}">${CG}<tr><th>Stagiaire</th><th>Entreprise</th><th>Fam.</th><th>Catégories</th><th>Début</th><th>Fin</th></tr>`+l.map(s=>{const sp=(pf!==undefined&&pf!==s.date_fin)?'<tr class="sp"><td colspan="6"></td></tr>':'';pf=s.date_fin;
     const ici=auj&&enPlace(s,T),nm=`<b>${esc(s.prenom)} ${esc(s.nom)}</b>`;
     const c1=ici?`<td class="pn ${s.present?'on':''}" onclick="presence('${s.id}',${!s.present},'${esc(s.prenom+' '+s.nom).replace(/'/g,"\\'")}')">${s.present?'☑':'☐'} ${nm}<br><span class="pr ${s.present?'ok':''}">${s.present?'PRÉSENT '+hh(s):'à confirmer'}</span></td>`:`<td>${nm}</td>`;
     return sp+`<tr>${c1}<td>${esc(s.entreprise||'—')}</td><td>${f}</td><td>${(s.categories||[]).map(esc).join(', ')||'—'}</td><td>${fr(s.date_debut)}</td><td>${fr(s.date_fin)}</td></tr>`}).join('')+`</table></div>`}).join('');
  app.innerHTML=`<div>${noms}</div>${onglets()}<div class="nav"><button onclick="decaler(-7)">◀ Semaine préc.</button><button onclick="jour=iso(new Date());go()">Cette semaine</button><button onclick="decaler(7)">Semaine suiv. ▶</button></div>
   <h1>Stagiaires – semaine du ${fr(lun)} au ${fr(ven)}</h1>${auj&&att.length?`<p><b>Présents aujourd'hui : ${pres} / ${att.length}</b> <small>— touchez le nom d'un stagiaire pour confirmer sa présence.</small></p>`:''}${tabs||'<p>Aucun stagiaire cette semaine.</p>'}`}
// ---- Charge testeurs (lecture seule) : chaque testeur a, CHAQUE JOUR, sa couleur + sa lettre + sa trame ----
const TH=['#f87171','#60a5fa','#facc15','#4ade80','#fb923c','#c084fc','#22d3ee','#f472b6','#a3a3a3','#d6a77a'],
 TP=['','repeating-linear-gradient(45deg,rgba(0,0,0,.4) 0 2px,transparent 2px 6px)','radial-gradient(rgba(0,0,0,.5) 1.2px,transparent 1.7px) 0 0/6px 6px','repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 2px,transparent 2px 6px)'];
const tchip=t=>`<span class="tc" style="${t.st}">${esc(t.l)}<sup>${t.j}</sup></span>`;
function testMap(jr,F,CR){const m={};let k=0;jr.forEach((d,di)=>{const ids=[];CR.filter(c=>c.jour==d).forEach(c=>{const x=c.formateur_id||'';if(!ids.includes(x))ids.push(x)});
 const ix=q=>{const i=F.findIndex(x=>x.id==q);return i<0?99:i};ids.sort((a,b)=>ix(a)-ix(b));
 const used=[];m[d]={};ids.forEach(x=>{const f=F.find(y=>y.id==x),nom=f?f.nom:'À affecter';let n=1,l;do{l=nom.slice(0,n).toUpperCase();n++}while(used.includes(l)&&n<=nom.length);used.push(l);
  const bg=TH[k%TH.length],p=TP[Math.floor(k/TH.length)%TP.length];k++;
  m[d][x]={nom,l:f?l:'?',j:di+1,bg,st:`background-color:${bg};${p?'background-image:'+p+';':''}`}})});return m}
async function vueCharge(noms){const lun=lundiDe(jour),ven=addj(lun,4),jr=[0,1,2,3,4].map(i=>addj(lun,i)),JL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];if(!acces.futures&&futur(lun))return ferme(noms,navS());
  const{data,error}=await sb.rpc('charge_testeurs_semaine',{p_code:code,p_formateur:fid,p_lundi:lun});
  if(error){const m=error.message||'';if(m.includes('semaine_future'))return ferme(noms,navS());if(m.includes('vue_fermee')){vue='plan';return go()}if(m.includes('charge_testeurs_semaine'))return msg('Fonction manquante : exécuter migration_v12.sql dans Supabase.');fid='';return erreur(error)}
  const F=data.formateurs,CR=data.cr,tm=testMap(jr,F,CR),pr=c=>c.nature=='Pratique',th=c=>c.nature=='Théorie',
   ut=c=>pr(c)?c.stagiaires.reduce((a,x)=>a+(+x.ut_prat||0),0):th(c)?(+c.ut_session||0):0,u=n=>String(Math.round(n*100)/100).replace('.',','),hm=x=>String(x).slice(0,5);
  const tl=(c)=>{const t=tm[c.jour][c.formateur_id||''];return `<span class="tl">${tchip(t)} ${JN[jr.indexOf(c.jour)]} ${hm(c.debut)} ${th(c)?'Théorie':'Prat.'+(c.categorie?' '+esc(c.categorie):'')} <small>(${esc(t.nom)})</small></span>`};
  const syn=jr.map((d,i)=>{const ks=Object.keys(tm[d]);if(!ks.length)return '';
   return `<h3>${JL[i]} ${fr(d)}</h3><div class="tw"><table class="fam"><colgroup><col style="width:22%"><col style="width:18%"><col style="width:60%"></colgroup><tr><th>Testeur</th><th>UT du jour</th><th>Candidats testés</th></tr>`+ks.map(k=>{const t=tm[d][k],
    cs=CR.filter(c=>c.jour==d&&(c.formateur_id||'')==k),tot=cs.reduce((a,c)=>a+ut(c),0),pra=cs.filter(pr).reduce((a,c)=>a+ut(c),0);
    return `<tr><td>${tchip(t)} <b>${esc(t.nom)}</b></td><td><b>${u(tot)} / ${u(data.max_total)} UT</b><br><small>dont pratique ${u(pra)} / ${u(data.max_pratique)}</small></td><td>${cs.map(c=>`${hm(c.debut)}-${hm(c.fin)} ${c.famille}${c.categorie?' '+esc(c.categorie):''} ${th(c)?'théorie':'pratique'} : ${c.stagiaires.map(x=>esc(x.prenom+' '+x.nom)).join(', ')||(c.previsionnel?'🗓 prévisionnel (candidats à confirmer)':'<i>vide</i>')}`).join('<br>')}</td></tr>`}).join('')+`</table></div>`}).join('');
  const bySt={};CR.forEach(c=>c.stagiaires.forEach(x=>{(bySt[x.id]=bySt[x.id]||{s:x,c:[]}).c.push(c)}));
  const blocs=FAMS.map(f=>{const ck=o=>o.c.map(x=>x.jour+x.debut).sort().join('|'),l=Object.values(bySt).filter(o=>o.s.famille==f).sort((a,b)=>ck(a)<ck(b)?-1:ck(a)>ck(b)?1:(a.s.nom+a.s.prenom).localeCompare(b.s.nom+b.s.prenom));if(!l.length)return '';
   return `<h3>${f}</h3><div class="tw"><table class="fam cp" style="--fc:${FC[f]}"><colgroup><col style="width:28%"><col style="width:22%"><col style="width:10%"><col style="width:40%"></colgroup><tr><th>Stagiaire</th><th>Entreprise</th><th>Cat.</th><th>Tests planifiés (testeur du jour)</th></tr>`+
    l.map(o=>`<tr><td><b>${esc(o.s.prenom)} ${esc(o.s.nom)}</b>${o.s.theorie_seule?' <span class="th1">📖 théorie seule</span>':''}</td><td>${esc(o.s.entreprise||'—')}</td><td>${(o.s.categories||[]).map(k=>catFait(o,k)).join(' ')||'—'}</td><td>${o.c.sort((a,b)=>(a.jour+a.debut).localeCompare(b.jour+b.debut)).map(tl).join('<br>')}</td></tr>`).join('')+`</table></div>`}).join('');
  app.innerHTML=`<div>${noms}</div>${onglets()}<div class="nav"><button onclick="decaler(-7)">◀ Semaine préc.</button><button onclick="jour=iso(new Date());go()">Cette semaine</button><button onclick="decaler(7)">Semaine suiv. ▶</button></div>
   <h1>Charge des testeurs – semaine du ${fr(lun)} au ${fr(ven)}</h1><p class="leg">Tous les tests planifiés. Chaque testeur a, chaque jour, sa couleur + sa lettre + sa trame.</p>`+(syn?`<h2>Synthèse par jour et par testeur</h2>${syn}<h2>Par stagiaire</h2>${blocs}`:'<p>Aucun test planifié cette semaine.</p>')}
// « Test fait » : la catégorie testée en PRATIQUE se barre en rouge ; seul le testeur du test peut la pointer (retoucher = annuler, avec confirmation)
function catFait(o,k){const cs=o.c.filter(c=>c.nature=='Pratique'&&c.categorie==k),fl=c=>!!((c.stagiaires.find(y=>y.id==o.s.id)||{}).fait),fait=cs.some(fl),mine=cs.filter(c=>c.formateur_id==fid),t=mine.find(c=>fl(c)==fait)||mine[0];
 const bx='display:inline-block;box-sizing:border-box;min-width:34px;padding:5px 8px;margin:2px 3px 2px 0;border:2px solid #000;border-radius:7px;font-weight:700;color:#000;text-align:center;line-height:1.1;cursor:pointer;touch-action:manipulation',
  bg=fait?'background:linear-gradient(to top left,transparent calc(50% - 2px),#b91c1c calc(50% - 2px),#b91c1c calc(50% + 2px),transparent calc(50% + 2px)),#e5e7eb;':'background:#fff;';      // fait : diagonale rouge épaisse + fond gris, la catégorie reste lisible
 const lab=esc(k);
 return t?`<span style="${bx}${bg}" onclick="testFait('${t.id}','${o.s.id}',${fait},'${esc(o.s.prenom+' '+o.s.nom).replace(/'/g,"\\'")}','${esc(k).replace(/'/g,"\\'")}')">${lab}</span>`:(fait?`<span style="${bx.replace('cursor:pointer;','')}${bg}">${lab}</span>`:lab)}      // catégorie d'un autre testeur : barrée si faite (sans action), sinon texte simple
async function testFait(cr,st,fait,nom,k){if(!confirm(fait?'Retirer « test fait » pour '+nom+' (catégorie '+k+') ?':'Test pratique fait : '+nom+', catégorie '+k+' ?'))return;
 const{error}=await sb.rpc('marquer_test_fait',{p_code:code,p_formateur:fid,p_creneau:cr,p_stagiaire:st,p_fait:!fait});
 if(error){if((error.message||'').includes('marquer_test_fait'))alert('Fonction manquante : exécuter migration_v19.sql dans Supabase.');else if((error.message||'').includes('pas_testeur'))alert("Seul le testeur de ce test pratique peut le valider.");else return erreur(error)}go()}
async function presence(id,v,nom){if(!v&&!confirm('Retirer la présence de '+nom+' ?'))return;
  const{error}=await sb.rpc('marquer_presence',{p_code:code,p_formateur:fid,p_stagiaire:id,p_present:v});
  if(error){if((error.message||'').includes('hors_periode'))alert("Ce stagiaire n'est pas en période aujourd'hui.");else return erreur(error)}go()}
// Temps réel : chaque modification incrémente "signal" => on recharge l'affichage
sb.channel('ping').on('postgres_changes',{event:'*',schema:'public',table:'signal'},()=>{if(code)go()}).subscribe();
go();
</script></body></html>

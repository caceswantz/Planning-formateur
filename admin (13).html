<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin planning</title><link rel="stylesheet" href="style.css"><style>#pz{display:none}@page{size:A4;margin:8mm}@media print{main{display:none}#pz{display:block}body{background:#fff;color:#000;font-size:9pt;line-height:1.2}h1{font-size:12pt;margin:0 0 2mm}h3{font-size:10pt;margin:3mm 0 1mm}h4{margin:2mm 0 1mm;font-size:9pt}table,table.cp{font-size:8pt;break-inside:avoid}td,th{border:1px solid #000;padding:1px 3px}tr:nth-child(even) td{background:none}tr.tot td{background:#fff!important;border-top:2px solid #000}.np,.warn{display:none}.card{box-shadow:none;border:1px solid #000;padding:2mm}table.fam th{background:#fff;border-top:2px solid #000}td.j{min-width:0}td.j.on{background:#ddd!important}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script src="config.js"></script></head>
<body><main id="app"></main><div id="pz"></div><div id="pop" hidden></div><script>
// Administration v2. Rubriques : Planning, Stagiaires, Formateurs, Paramètres. Accès protégé par Supabase Auth + RLS.
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), app=document.getElementById('app');
const FAM=['R482','R484','R485','R486','R489','R490'], JN=['Lun','Mar','Mer','Jeu','Ven'], $=id=>document.getElementById(id);
const FC={R482:'#ea580c',R484:'#2563eb',R485:'#16a34a',R486:'#9333ea',R489:'#dc2626',R490:'#0891b2'};   // couleur de chaque famille
const fcs=x=>FC[x]?`style="border-left:10px solid ${FC[x]}"`:'';
const dayType=(s,d)=>(s.programme||{})[d]||s.type;   // activité du jour : Formation / Test / Les deux / Absent
const dEnPlace=(s,d)=>s.date_debut&&d>=s.date_debut&&(!s.date_fin||d<=s.date_fin)&&dayType(s,d)!='Absent';
const abr=t=>({'Les deux':'F+T',Test:'Test',Formation:'Form.'})[t]||'';
// Badges de nature : libellé complet + icône + couleur (orange = PRATIQUE, bleu = THÉORIE)
const natB=n=>n=='Théorie'?'<span class="bd theo"><span class="ic">📖</span>THÉORIE</span>':n=='Pratique'?'<span class="bd pra"><span class="ic">🔧</span>PRATIQUE</span>':'';
const typeB=c=>[c.est_formation&&`<span class="ty">Formation</span>${natB(c.nature_formation)}`,c.est_test&&`<span class="ty">Test</span>${natB(c.nature_test)}`].filter(Boolean).join('<span class="ty"> + </span>');
const T={formateurs:'f',salles:'sa',stagiaires:'st',creneaux:'cr'};   // table -> clé du cache D
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const lundiDe=s=>add(s,-((new Date(s+'T12:00').getDay()+6)%7));
let S={lundi:lundiDe(iso(new Date())),page:'planning',fam:'R482',edit:null,sel:[]}, D={};
const ok=async q=>{const r=await q;if(r.error){alert(r.error.message);throw r.error}return r.data};
const opt=(a,v,l,sel)=>a.map(x=>`<option value="${x[v]}" ${x[v]==sel?'selected':''}>${l(x)}</option>`).join('');
const nomSt=id=>{const s=D.st.find(x=>x.id==id);return s?s.prenom+' '+s.nom+((s.categories||[]).length?' ('+s.categories.join(', ')+')':''):'?'};
const catsDe=c=>[...new Set([c.categorie,...c.creneau_stagiaires.flatMap(x=>(D.st.find(s=>s.id==x.stagiaire_id)||{}).categories||[])].filter(Boolean))];
const tagSt=(id,c,x)=>{const s=D.st.find(x=>x.id==id)||{prenom:'?',nom:''};return `<span class="tag">${s.prenom} ${s.nom}${(s.categories||[]).map(k=>`<span class="sc">Cat. ${k}</span>`).join('')}${c&&estPr(c)?`<span class="sc">${fmt(+x.ut_prat||0)} UT</span>`:''}</span>`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wk=()=>`<div class="nav"><button class="sec" onclick="S.lundi=add(S.lundi,-7);charger()">◀ Précédente</button><b>Semaine du ${S.lundi.split('-').reverse().join('/')}</b><button class="sec" onclick="S.lundi=add(S.lundi,7);charger()">Suivante ▶</button><input type="date" onchange="S.lundi=lundiDe(this.value);charger()"></div>`;

async function init(){const{data}=await sb.auth.getSession();data.session?charger():login()}
function login(){app.innerHTML=`<h1>Admin</h1><input id="e" type="email" placeholder="E-mail"><input id="p" type="password" placeholder="Mot de passe"><button onclick="connexion()">Connexion</button>`}
async function connexion(){const{error}=await sb.auth.signInWithPassword({email:$('e').value,password:$('p').value});error?alert(error.message):charger()}
async function charger(){
 const q=await Promise.all([sb.from('parametres').select('*').single(),sb.from('formateurs').select('*').order('nom'),sb.from('salles').select('*').order('nom'),
  sb.from('stagiaires').select('*').order('nom'),sb.from('categories').select('*').order('ordre'),
  sb.from('creneaux').select('*,creneau_stagiaires(stagiaire_id,ut_prat,ut_theo)').gte('jour',S.lundi).lte('jour',add(S.lundi,4)).order('jour').order('debut'),sb.from('bareme_ut').select('*'),sb.from('options_famille').select('*').order('nom'),sb.from('stagiaire_options').select('*'),sb.from('limites_ut').select('*').single(),sb.from('habilitations').select('*')]);
 const e=q.find(x=>x.error);if(e)return alert('Accès refusé ou migration manquante : '+e.error.message);
 D={p:q[0].data,f:q[1].data,sa:q[2].data,st:q[3].data,cat:q[4].data,cr:q[5].data,bar:q[6].data,opt:q[7].data,so:q[8].data,lim:q[9].data,hab:q[10].data};render()}
function render(){
 app.innerHTML=`<div class="nav menu">${[['planning','Planning'],['stagiaires','Stagiaires'],['formateurs','Formateurs'],['params','Paramètres']].map(([k,l])=>`<button class="${S.page==k?'':'sec'}" onclick="S.page='${k}';S.edit=null;render()">${l}</button>`).join('')}<button class="sec" onclick="sb.auth.signOut().then(login)">Déconnexion</button></div>
 <p id="ban" class="warn" hidden onclick="charger()">Données modifiées sur un autre poste — toucher pour actualiser</p><div id="pg"></div>`;
 ({planning:pPlanning,stagiaires:pStag,formateurs:pForm,params:pParams})[S.page]()}

// ---- Mises à jour protégées : refusées si quelqu'un d'autre a modifié l'élément entre-temps (colonne maj_le) ----
async function upd(t,id,v){const row=D[T[t]].find(x=>x.id==id);
 const d=await ok(sb.from(t).update(v).eq('id',id).eq('maj_le',row.maj_le).select());
 if(!d.length)alert('Cet élément a été modifié sur un autre poste : vos changements n\'ont PAS été enregistrés. Les données sont rechargées.');charger()}
async function sup(t,id){if(confirm('Supprimer ?')){await ok(sb.from(t).delete().eq('id',id));charger()}}
async function renom(t,id){const n=prompt('Nom',D[T[t]].find(x=>x.id==id).nom);if(n)upd(t,id,{nom:n})}
async function ajout(t){const n=prompt('Nom');if(n){await ok(sb.from(t).insert({nom:n}));charger()}}

// ---- Moteur UT (tests uniquement) ----
// Pratique : coût figé par candidat (creneau_stagiaires.ut_prat = UT de la catégorie + options, calculé à l'enregistrement du créneau).
// Théorie : 1 UT par SESSION (= un créneau de théorie d'une recommandation), quel que soit le nombre de candidats ; valeur figée dans creneaux.ut_session.
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const frc=d=>d?d.split('-').reverse().slice(0,2).join('/'):'—';
const bar=(f,c)=>{const b=D.bar.find(x=>x.famille==f&&x.categorie==(c||''));return b?+b.ut_pratique:0};
const optUt=(sid,c)=>D.so.filter(o=>o.stagiaire_id==sid&&o.categorie==c).reduce((a,o)=>a+(+(D.opt.find(x=>x.id==o.option_id)||{}).ut||0),0);
const utPrat=(s,cat)=>(cat?[cat]:(s.categories&&s.categories.length?s.categories:[''])).reduce((a,c)=>a+bar(s.famille,c)+optUt(s.id,c),0);   // UT pratique : catégorie(s) + 0,5 par option cochée
const isTest=s=>s.type!='Formation'||Object.values(s.programme||{}).some(v=>v=='Test'||v=='Les deux');
const utTxt=s=>isTest(s)?fmt(utPrat(s)):'-';       // « - » pour un stagiaire en formation uniquement
const estTh=c=>c.est_test&&c.nature_test=='Théorie', estPr=c=>c.est_test&&c.nature_test=='Pratique';
const utCr=c=>estPr(c)?c.creneau_stagiaires.reduce((a,x)=>a+(+x.ut_prat||0),0):estTh(c)?(+c.ut_session||0):0;
const nomF=c=>(D.f.find(x=>x.id==c.formateur_id)||{}).nom||'<i>formateur à affecter</i>';
// Charge d'un testeur un jour donné : total, dont pratique
function charge(fid,d,cr){let tot=0,pra=0;
 cr.filter(c=>c.formateur_id==fid&&c.jour==d&&c.est_test).forEach(c=>{const u=utCr(c);tot+=u;if(estPr(c))pra+=u});return{tot,pra}}
// Messages de dépassement (admin, temps réel) : 6 UT pratique, 7 UT total, 12 candidats par session de théorie
function alertes(fid,d){const L=D.lim,g=charge(fid,d,D.cr),m=[];
 if(g.tot>+L.max_total)m.push(`${fmt(g.tot)} UT programmées, limite ${fmt(+L.max_total)}`);
 if(g.pra>+L.max_pratique)m.push(`${fmt(g.pra)} UT de pratique, limite ${fmt(+L.max_pratique)}`);
 D.cr.filter(c=>c.formateur_id==fid&&c.jour==d&&estTh(c)&&c.creneau_stagiaires.length>+L.max_candidats).forEach(c=>m.push(`session de théorie ${c.famille} (${c.debut.slice(0,5)}) : ${c.creneau_stagiaires.length} candidats, limite ${L.max_candidats}`));
 return m}
const depasse=fid=>[0,1,2,3,4].some(i=>alertes(fid,add(S.lundi,i)).length);
// Jauge de charge (Planning) : « X / 7 UT, dont pratique Y / 6 UT » — aucune mention de candidats
function chargeCard(){const L=D.lim,r=[];D.f.forEach(f=>[0,1,2,3,4].forEach(i=>{const d=add(S.lundi,i),g=charge(f.id,d,D.cr),al=alertes(f.id,d);
 if(g.tot>0||D.cr.some(c=>c.formateur_id==f.id&&c.jour==d&&c.est_test))
  r.push(`<tr><td>${al.length?'🔴 ':''}<b>${f.nom}</b></td><td>${JN[i]}</td><td><b>${fmt(g.tot)} / ${fmt(+L.max_total)} UT</b>, dont pratique ${fmt(g.pra)} / ${fmt(+L.max_pratique)} UT${al.length?`<br><span class="warn">DÉPASSÉ : ${al.join(' · ')}</span>`:''}</td></tr>`)}));
 return `<div class="card"><h3>Charge des testeurs (tests)</h3>${r.length?`<div class="tw"><table>${r.join('')}</table></div>`:'<small>Aucun test cette semaine.</small>'}</div>`}

// ---- Contrôles avant enregistrement d'un créneau (création, modification, déplacement) ----
// Conflits : même jour, horaires qui se chevauchent (comparaison sur HH:MM)
function conflits(r,sel,me,jourAll){const cf=[],a=r.debut.slice(0,5),b=r.fin.slice(0,5);
 jourAll.filter(c=>c.id!=me&&c.debut.slice(0,5)<b&&c.fin.slice(0,5)>a).forEach(c=>{const h=c.debut.slice(0,5)+'-'+c.fin.slice(0,5);
  const occ=c.creneau_stagiaires.length>0;      // un créneau vidé (candidat supprimé) est « à combler » : il n'occupe plus le testeur ni la salle
  if(occ&&c.formateur_id&&c.formateur_id==r.formateur_id)cf.push('Formateur déjà pris '+h);
  if(occ&&c.salle_id&&c.salle_id==r.salle_id)cf.push('Salle déjà prise '+h);
  c.creneau_stagiaires.forEach(x=>{if(sel.includes(x.stagiaire_id))cf.push('Stagiaire déjà pris : '+nomSt(x.stagiaire_id))})});
 return [...new Set(cf)]}
// Limites : renvoie les blocages (b) et les alertes (a) selon le mode réglé dans Paramètres. rows = [{stagiaire_id,ut_prat}]
function verifLim(r,sel,me,jourAll,rows){const L=D.lim,res={b:[],a:[]},pousse=(mode,t)=>res[mode=='blocage'?'b':'a'].push(t);
 if(!r.est_test)return res;
 if(r.nature_test=='Théorie'&&sel.length>+L.max_candidats)pousse(L.mode_candidats,`Session de théorie ${r.famille} : ${sel.length} candidats, limite ${L.max_candidats}`);
 if(!r.formateur_id)return res;
 const nv={id:me||'nouveau',jour:r.jour,formateur_id:r.formateur_id,est_test:true,nature_test:r.nature_test,ut_session:r.ut_session,creneau_stagiaires:rows};
 const g=charge(r.formateur_id,r.jour,[...jourAll.filter(c=>c.id!=me),nv]),nom=(D.f.find(x=>x.id==r.formateur_id)||{}).nom;
 if(g.tot>+L.max_total)pousse(L.mode_total,`${nom} : ${fmt(g.tot)} UT programmées, limite ${fmt(+L.max_total)}`);
 if(g.pra>+L.max_pratique)pousse(L.mode_pratique,`${nom} : ${fmt(g.pra)} UT de pratique, limite ${fmt(+L.max_pratique)}`);
 return res}
// ---- Règles des tests (pratique) : catégories inscrites, durée = UT, un seul testeur par catégorie ----
const mins=h=>{const[a,b]=String(h).slice(0,5).split(':');return +a*60+ +b};
const hm=m=>Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0');
const aCat=(s,c)=>(s.categories||[]).includes(c);
const catsFam=f=>D.cat.filter(k=>k.famille==f);
// Durée maximale d'un test pratique = somme des UT des candidats (1 UT = 1 h). Ne s'applique pas à un créneau Formation + Test.
function dureeMax(r,rows){if(!r.est_test||r.nature_test!='Pratique'||r.est_formation)return '';
 const u=rows.reduce((a,x)=>a+(+x.ut_prat||0),0);if(u<=0)return '';
 const mx=Math.round(u*60),du=mins(r.fin)-mins(r.debut);
 return du>mx?`Durée trop longue : ${fmt(u)} UT = ${hm(mx)} maximum (de ${r.debut.slice(0,5)} à ${hm(mins(r.debut)+mx).replace(' h ',':')} au plus)`:''}
// Candidats non inscrits dans la catégorie testée
function bloquantsCat(r,sel){if(!r.est_test||!r.categorie)return [];
 const k=sel.map(id=>D.st.find(x=>x.id==id)).filter(x=>x&&!aCat(x,r.categorie));
 return k.length?[`Catégorie ${r.famille} ${r.categorie} : non inscrit(s) dans cette catégorie : ${k.map(x=>x.prenom+' '+x.nom).join(', ')}`]:[]}
// Un seul testeur par catégorie au même moment (sauf catégories « 2 testeurs », ex. R489 cat. 3)
function conflitCat(r,me,jourAll){if(!r.est_test||!r.formateur_id)return '';
 const lst=catsFam(r.famille);if(lst.length&&!r.categorie)return '';
 const k=lst.find(x=>x.nom==r.categorie);if(k&&k.multi_testeurs)return '';
 const a=r.debut.slice(0,5),b=r.fin.slice(0,5);
 const c=jourAll.find(c=>c.id!=me&&c.creneau_stagiaires.length&&c.est_test&&c.famille==r.famille&&(c.categorie||'')==(r.categorie||'')&&c.formateur_id&&c.formateur_id!=r.formateur_id&&c.debut.slice(0,5)<b&&c.fin.slice(0,5)>a);
 return c?`Catégorie ${r.famille}${r.categorie?' '+r.categorie:''} déjà testée par ${nomF(c).replace(/<[^>]+>/g,'')} de ${c.debut.slice(0,5)} à ${c.fin.slice(0,5)} : un seul testeur à la fois sur une même catégorie`:''}
// Testeurs habilités (Formateurs > Habilitations) : un test ne peut être confié qu'à un testeur habilité pour la catégorie
const habil=(fid,fam,cat)=>(D.hab||[]).some(h=>h.formateur_id==fid&&h.famille==fam&&(!cat||h.categorie==cat));
function testeurOk(r){if(!r.est_test||!r.formateur_id)return '';
 return habil(r.formateur_id,r.famille,r.categorie)?'':`${nomF(r).replace(/<[^>]+>/g,'')} n'est pas testeur habilité en ${r.famille}${r.categorie?' catégorie '+r.categorie:''} (voir Formateurs > Habilitations)`}
// Créneau à combler : vide (candidat supprimé ou retiré) ou temps libre dans un test pratique
function trou(c){const n=c.creneau_stagiaires.length;if(!c.est_test&&!c.est_formation)return '';
 if(!n)return 'CRÉNEAU À COMBLER : plus aucun candidat';
 if(estPr(c)&&!c.est_formation){const u=c.creneau_stagiaires.reduce((a,x)=>a+(+x.ut_prat||0),0),g=mins(c.fin)-mins(c.debut)-Math.round(u*60);if(u>0&&g>=10)return `TEMPS À COMBLER : ${hm(g)} libre dans ce créneau`}
 return ''}
// Règles fixes (non paramétrables) : catégories jamais testées en même temps, même par des testeurs différents ; plafond de candidats par jour
// Groupes de catégories jamais testées en même temps (toutes familles confondues dans un groupe), même avec des testeurs différents
const EXCL=[['R489 1A','R489 1B','R485 1','R485 2'],['R482 A','R482 G']];
// Quotas par jour de test, tous testeurs confondus : en UT (somme des UT pratique) ou en nombre de candidats
const CAPS=[{nom:'R489 1A/1B + R485 1/2',c:{R489:['1A','1B'],R485:['1','2']},ut:6},{nom:'R484 1/2',c:{R484:['1','2']},cand:8}];
const cle=(f,k)=>f+' '+k;
const partners=(f,k)=>k?EXCL.filter(g=>g.includes(cle(f,k))).flatMap(g=>g.filter(x=>x!=cle(f,k))):[];
function conflitExcl(r,me,jourAll){if(!r.est_test||!r.categorie)return '';const p=partners(r.famille,r.categorie);if(!p.length)return '';
 const a=r.debut.slice(0,5),b=r.fin.slice(0,5),c=jourAll.find(c=>c.id!=me&&c.creneau_stagiaires.length&&c.est_test&&c.categorie&&p.includes(cle(c.famille,c.categorie))&&c.debut.slice(0,5)<b&&c.fin.slice(0,5)>a);
 return c?`${r.famille} ${r.categorie} et ${c.famille} ${c.categorie} ne peuvent jamais être testées en même temps (${c.famille} ${c.categorie} déjà placée de ${c.debut.slice(0,5)} à ${c.fin.slice(0,5)}, même avec un autre testeur)`:''}
const capDe=c=>c.est_test&&c.nature_test=='Pratique'&&c.categorie?CAPS.find(g=>(g.c[c.famille]||[]).includes(c.categorie)):null;
const r2=x=>Math.round(x*100)/100;
const candJour=(jourAll,me,g)=>new Set(jourAll.filter(c=>c.id!=me&&capDe(c)===g).flatMap(c=>c.creneau_stagiaires.map(x=>x.stagiaire_id)));
const utJour=(jourAll,me,g)=>r2(jourAll.filter(c=>c.id!=me&&capDe(c)===g).reduce((a,c)=>a+c.creneau_stagiaires.reduce((b,x)=>b+(+x.ut_prat||0),0),0));
function plafondJour(r,sel,me,jourAll,rows){const g=capDe(r);if(!g)return '';
 if(g.ut){const dej=utJour(jourAll,me,g),nv=r2((rows||[]).reduce((a,x)=>a+(+x.ut_prat||0),0));
  return r2(dej+nv)>g.ut?`Quota de ${g.ut} UT par jour de test pour ${g.nom} (tous testeurs confondus) dépassé : ${fmt(dej)} UT déjà placées + ${fmt(nv)} UT de ce créneau = ${fmt(dej+nv)} UT (reste ${fmt(Math.max(0,g.ut-dej))} UT)`:''}
 const dej=candJour(jourAll,me,g),tot=new Set([...dej,...sel]);
 return tot.size>g.cand?`Maximum ${g.cand} candidats par jour de test pour ${g.nom} (tous testeurs confondus) : ${dej.size} déjà placé(s) + ${[...new Set(sel)].filter(x=>!dej.has(x)).length} nouveau(x) = ${tot.size}`:''}
// Relit les créneaux du jour visé, vérifie règles bloquantes, conflits et limites ; false si refusé (blocage ou confirmation refusée)
async function verifierEtConfirmer(r,sel,me,rows){
 const jourAll=await ok(sb.from('creneaux').select('*,creneau_stagiaires(stagiaire_id,ut_prat,ut_theo)').eq('jour',r.jour));
 let cf=conflits(r,sel,me,jourAll);
 const bc=r.est_test?cf.filter(x=>/^(Formateur|Stagiaire)/.test(x)):[];cf=cf.filter(x=>!bc.includes(x));      // test : formateur ou stagiaire déjà pris = refus
 const dur=[testeurOk(r),...bloquantsCat(r,sel),dureeMax(r,rows),conflitCat(r,me,jourAll),conflitExcl(r,me,jourAll),plafondJour(r,sel,me,jourAll,rows),...bc].filter(Boolean);
 if(dur.length){alert('ENREGISTREMENT REFUSÉ :\n- '+dur.join('\n- '));return false}
 const lm=verifLim(r,sel,me,jourAll,rows);
 if(lm.b.length){alert('ENREGISTREMENT REFUSÉ (limite en mode Blocage) :\n- '+lm.b.join('\n- '));return false}
 const tous=[...new Set([...cf,...lm.a])];
 return !tous.length||confirm('CONFLITS / LIMITES :\n- '+tous.join('\n- ')+'\n\nEnregistrer quand même ?')}

// ---- Tri des stagiaires : début (lundi→vendredi), puis fin croissante (sans fin = après), puis catégories de la famille.
// À début et fin égaux : une seule catégorie d'abord (ordre de la famille), puis les stagiaires à plusieurs catégories (catégorie principale d'abord).
const catIdx=(f,c)=>{const i=D.cat.filter(k=>k.famille==f).findIndex(k=>k.nom==c);return i<0?998:i};
function cmpSt(a,b){const ia=(a.categories||[]).map(c=>catIdx(a.famille,c)).sort((x,y)=>x-y),ib=(b.categories||[]).map(c=>catIdx(b.famille,c)).sort((x,y)=>x-y);
 for(const[x,y]of[[a.date_debut||'9999-12-31',b.date_debut||'9999-12-31'],[a.date_fin||'9999-12-31',b.date_fin||'9999-12-31'],[+(ia.length>1),+(ib.length>1)]]){if(x<y)return-1;if(x>y)return 1}
 for(let i=0;i<Math.max(ia.length,ib.length);i++){const x=ia[i]??998,y=ib[i]??998;if(x!=y)return x-y}
 return(a.nom+' '+a.prenom).localeCompare(b.nom+' '+b.prenom,'fr')}
const semSt=f=>{const lun=S.lundi,ven=add(lun,4);return D.st.filter(s=>s.famille==f&&(!s.date_debut||(s.date_debut<=ven&&(!s.date_fin||s.date_fin>=lun)))).sort(cmpSt)};
const SJ=()=>[0,1,2,3,4].map(i=>add(S.lundi,i));

// ---- Statut « à planifier » (semaine affichée) : un candidat en test n'est complet que s'il a une théorie ET une pratique planifiées ----
const inCr=(c,id)=>c.creneau_stagiaires.some(x=>x.stagiaire_id==id);
function catsSansPratique(s){const cs=(s.categories||[]).length?s.categories:[''];
 return cs.filter(k=>!D.cr.some(c=>estPr(c)&&inCr(c,s.id)&&(!c.categorie||c.categorie==k)))}
function manqueTest(s){const th=D.cr.some(c=>estTh(c)&&inCr(c,s.id)),m=catsSansPratique(s),pr=m.length?'pratique'+(m[0]?' '+m.join(', '):''):'';
 return th&&!pr?'':[!th?'théorie':'',pr].filter(Boolean).join(' + ')+' à planifier'}
const sansCat=s=>catsFam(s.famille).length>0&&!(s.categories||[]).length;
function sansCatCard(){const l=D.st.filter(sansCat);return l.length?`<div class="card trou"><b>⚠ ${l.length} candidat(s) sans catégorie</b> (impossible de les placer en test) :<br>${l.map(s=>`${esc(s.prenom)} ${esc(s.nom)} (${s.famille}) <button class="sec" onclick="S.page='stagiaires';S.fam='${s.famille}';render();editSt('${s.id}')">✎ Renseigner</button>`).join('<br>')}</div>`:''}
function aPlanifier(s,jr){if(sansCat(s))return '⚠ CATÉGORIE MANQUANTE';const j=jr.filter(d=>dEnPlace(s,d));if(!j.length)return '';
 return j.some(d=>dayType(s,d)!='Formation')?manqueTest(s):(D.cr.some(c=>inCr(c,s.id))?'':'à planifier')}

// ---- Formateurs ----
function pForm(){$('pg').innerHTML=`<div class="card"><h2>Formateurs</h2>${D.f.map(f=>`<div><b>${f.nom}</b> ${depasse(f.id)?'<span class="warn">🔴 limite dépassée cette semaine</span>':''} <label class="k"><input type="checkbox" ${f.actif?'checked':''} onchange="upd('formateurs','${f.id}',{actif:this.checked})"> accès actif</label>
 <button class="sec" onclick="renom('formateurs','${f.id}')">✎</button><button class="del" onclick="sup('formateurs','${f.id}')">✕</button>
 <details ${S.hd==f.id?'open':''} style="margin:4px 0 10px"><summary>Habilitations testeur : <b>${habTxt(f.id)}</b></summary>${FAM.map(fa=>{const cs=catsFam(fa).map(c=>c.nom);return `<div><b>${fa}</b> `+(cs.length?cs:['']).map(k=>`<label class="k"><input type="checkbox" ${(D.hab||[]).some(h=>h.formateur_id==f.id&&h.famille==fa&&h.categorie==k)?'checked':''} onchange="togHab('${f.id}','${fa}','${k}',this.checked)"> ${k||'unique'}</label>`).join('')+`</div>`}).join('')}</details></div>`).join('')}<button onclick="ajout('formateurs')">+ Formateur</button><p class="leg">Un test ne peut être attribué qu'à un testeur habilité pour la famille et la catégorie (blocage à l'enregistrement). Pour un nouveau testeur : l'ajouter ici, puis cocher ses habilitations.</p></div>`}
const habTxt=fid=>{const l=FAM.map(fa=>{const h=(D.hab||[]).filter(x=>x.formateur_id==fid&&x.famille==fa).map(x=>x.categorie);const n=catsFam(fa).length;return h.length?fa+(n&&h.length<n?' ('+h.join(', ')+')':''):''}).filter(Boolean);return l.length?l.join(' · '):'aucune (non testeur)'};
async function togHab(fid,fa,k,v){S.hd=fid;await ok(v?sb.from('habilitations').upsert({formateur_id:fid,famille:fa,categorie:k}):sb.from('habilitations').delete().eq('formateur_id',fid).eq('famille',fa).eq('categorie',k));charger()}

// ---- Paramètres : accès, salles, catégories ----
function pParams(){$('pg').innerHTML=`<div class="card"><h2>Accès</h2><label class="k"><input type="checkbox" ${D.p.planning_ouvert?'':'checked'} onchange="majP({planning_ouvert:!this.checked})"> Planning fermé (tous les formateurs)</label><button class="sec" onclick="code()">Changer le code d'accès</button></div>
 <div class="card"><h2>Salles</h2>${D.sa.map(x=>`<div>${x.nom} <button class="sec" onclick="renom('salles','${x.id}')">✎</button><button class="del" onclick="sup('salles','${x.id}')">✕</button></div>`).join('')}<button onclick="ajout('salles')">+ Salle</button></div>
 <div class="card"><h2>Paramètres des catégories</h2>${FAM.map(f=>`<h4>${f}</h4>${D.cat.filter(c=>c.famille==f).map(c=>`<span class="tag">${c.nom} <a href="#" onclick="renCat('${c.id}');return false">✎</a> <a href="#" onclick="supCat('${c.id}');return false">✕</a> <label class="k"><input type="checkbox" ${c.multi_testeurs?'checked':''} onchange="majCat('${c.id}',this.checked)"> 2 testeurs</label></span>`).join('')||'<small>Catégorie unique</small> '}<button class="sec" onclick="addCat('${f}')">+ Catégorie</button>`).join('')}<p class="leg">« 2 testeurs » : autorise deux testeurs différents en même temps sur cette catégorie (par défaut seulement R489 cat. 3). Sinon un seul testeur à la fois par catégorie.</p></div>`+parUT()}
function parUT(){const L=D.lim,sel=k=>`<select onchange="majL({mode_${k}:this.value})"><option value="alerte" ${L['mode_'+k]=='alerte'?'selected':''}>Alerte</option><option value="blocage" ${L['mode_'+k]=='blocage'?'selected':''}>Blocage</option></select>`,
 num=k=>`<input type="number" step="0.25" value="${L[k]}" style="width:90px" onchange="majL({${k}:+this.value})">`;
 return `<div class="card"><h2>Barème UT (1 UT ≈ 1 h)</h2><p class="leg">Théorie : chaque session (un créneau de théorie d'une recommandation) compte ${num('ut_theorie')} UT pour le testeur, quel que soit le nombre de candidats. Un changement de barème ne modifie pas les plannings déjà enregistrés. Pour ajouter ou retirer une catégorie : « Paramètres des catégories » ci-dessus.</p>
 ${FAM.map(f=>{const cs=D.cat.filter(c=>c.famille==f).map(c=>c.nom);return `<h4>${f}</h4>`+(cs.length?cs:['']).map(c=>{const b=D.bar.find(x=>x.famille==f&&x.categorie==c);return `<label class="k">${c||'Catégorie unique'} <input type="number" step="0.05" style="width:90px" value="${b?b.ut_pratique:''}" onchange="majBar('${f}','${c}',this.value)"></label>`}).join('')}).join('')}</div>
 <div class="card"><h2>Options (UT en plus par option cochée)</h2>${FAM.map(f=>`<h4>${f}</h4>`+D.opt.filter(o=>o.famille==f).map(o=>`<span class="tag">${o.nom} +<input type="number" step="0.25" style="width:80px" value="${o.ut}" onchange="majOpt('${o.id}',this.value)"> UT <a href="#" onclick="supOpt('${o.id}');return false">✕</a></span>`).join('')+`<button class="sec" onclick="addOpt('${f}')">+ Option</button>`).join('')}</div>
 <div class="card"><h2>Limites d'un testeur (par jour, tests uniquement)</h2><div>Pratique : maximum ${num('max_pratique')} UT, options comprises ${sel('pratique')}</div><div>Total (pratique + théorie) : maximum ${num('max_total')} UT ${sel('total')}</div><div>Candidats : maximum ${num('max_candidats')} par session de théorie ${sel('candidats')}</div>
 <p class="leg">Alerte = avertissement (on peut confirmer) ; Blocage = enregistrement refusé.</p></div>`}
const majL=async v=>{await ok(sb.from('limites_ut').update(v).eq('id',1));charger()};
const majBar=async(f,c,v)=>{await ok(sb.from('bareme_ut').upsert({famille:f,categorie:c,ut_pratique:+v},{onConflict:'famille,categorie'}));charger()};
const majOpt=async(id,v)=>{await ok(sb.from('options_famille').update({ut:+v}).eq('id',id));charger()};
const supOpt=async id=>{if(confirm('Retirer cette option ?')){await ok(sb.from('options_famille').delete().eq('id',id));charger()}};
const addOpt=async f=>{const n=prompt('Nom de l\'option');if(n){await ok(sb.from('options_famille').insert({famille:f,nom:n,ut:0.5}));charger()}};
async function majP(v){await ok(sb.from('parametres').update(v).eq('id',1));charger()}
async function code(){const c=prompt('Nouveau code d\'accès des formateurs');if(c){await ok(sb.rpc('definir_code',{p_code:c}));alert('Code modifié.')}}
const majCat=async(id,v)=>{await ok(sb.from('categories').update({multi_testeurs:v}).eq('id',id));charger()};
async function addCat(f){const n=prompt('Nouvelle catégorie '+f);if(n){await ok(sb.from('categories').insert({famille:f,nom:n,ordre:D.cat.filter(c=>c.famille==f).length}));charger()}}
async function renCat(id){const c=D.cat.find(x=>x.id==id),n=prompt('Renommer',c.nom);if(!n||n==c.nom)return;
 await ok(sb.from('categories').update({nom:n}).eq('id',id));   // on répercute le nouveau nom sur stagiaires et créneaux
 for(const s of D.st.filter(s=>s.famille==c.famille&&(s.categories||[]).includes(c.nom)))await ok(sb.from('stagiaires').update({categories:s.categories.map(x=>x==c.nom?n:x)}).eq('id',s.id));
 await ok(sb.from('creneaux').update({categorie:n}).eq('famille',c.famille).eq('categorie',c.nom));
 await ok(sb.from('bareme_ut').update({categorie:n}).eq('famille',c.famille).eq('categorie',c.nom));
 await ok(sb.from('stagiaire_options').update({categorie:n}).eq('categorie',c.nom).in('stagiaire_id',D.st.filter(s=>s.famille==c.famille).map(s=>s.id)));charger()}
async function supCat(id){const c=D.cat.find(x=>x.id==id),n=D.st.filter(s=>s.famille==c.famille&&(s.categories||[]).includes(c.nom)).length;
 if(confirm(n?`${n} stagiaire(s) utilisent « ${c.nom} ». Supprimer quand même ? L'historique est conservé.`:'Supprimer ?')){await ok(sb.from('categories').delete().eq('id',id));charger()}}

// ---- Stagiaires : onglets par famille + vue globale ----
const repStag=f=>{const n=f=='Globale'?FAM.reduce((a,x)=>a+semSt(x).length,0):semSt(f).length;return n?` <span class="rep">👥 ${n}</span>`:''};
function pStag(){const gl=S.fam=='Globale';$('pg').innerHTML=`<div class="nav">${[...FAM,'Globale'].map(t=>`<button ${fcs(t)} class="${S.fam==t?'':'sec'}" onclick="S.fam='${t}';render()">${t=='Globale'?'Vue globale':t}${repStag(t)}</button>`).join('')}</div>${wk()}<button class="sec" onclick="imprimerStag()">Imprimer cet aperçu</button><button onclick="editSt(null,'${gl?'R482':S.fam}')">+ Nouveau stagiaire</button><div class="card" id="sf" hidden></div>${sansCatCard()}
 <p class="leg">${gl?'UT = pratique + 0,5 par option cochée, hors théories (« - » = formation seule). Tri : date de début, puis de fin, puis catégories. Touchez une date pour modifier le stagiaire.':'▶ début · ■ fin · Form. / Test / F+T = activité du jour · abs. = absent · touchez un jour pour le définir. Les horaires se gèrent dans Planning.'}</p>
 ${gl?tabGlobale():`${tabFam(S.fam)}
 <button class="sec" onclick="$('csv').click()">Import CSV</button><input id="csv" type="file" accept=".csv" hidden onchange="importCsv(this.files[0])"><small> nom;prénom;entreprise;famille;catégories (A|B);type;début;fin</small>`}`}
// Vue globale : tableaux compacts par famille (colonnes de largeurs fixes, donc alignées d'une famille à l'autre)
// UT (pratique + options, hors théories) : total par famille, total par JOUR DE FIN, total général
const CG='<colgroup><col style="width:25%"><col style="width:21%"><col style="width:7%"><col style="width:17%"><col style="width:8%"><col style="width:8%"><col style="width:7%"><col class="np" style="width:7%"></colgroup>';
function finBuckets(l){const jr=SJ(),b=[0,0,0,0,0,0];l.forEach(s=>{if(!isTest(s))return;const i=jr.indexOf(s.date_fin);b[i<0?5:i]+=utPrat(s)});return b}
const finTxt=b=>b.map((u,i)=>u?`${i<5?JN[i]+' '+frc(SJ()[i]):'Après ven. / sans fin'} : <b>${fmt(u)}</b>`:'').filter(Boolean).join(' · ')||'—';
function tabGlobale(){let tot=0,all=[0,0,0,0,0,0];const h=FAM.map(f=>{const l=semSt(f);if(!l.length)return '';const ut=l.reduce((a,s)=>a+(isTest(s)?utPrat(s):0),0),b=finBuckets(l);tot+=ut;b.forEach((u,i)=>all[i]+=u);return `<h3>${f} <button class="del np" onclick="viderFam('${f}')">Vider ${f} (${l.length})</button></h3>`+tabCompact(f,l,ut,b)}).join('');
 return (h||'<small>Aucun stagiaire cette semaine.</small>')+`<div class="card"><b>Total général de la semaine : ${fmt(tot)} UT</b> (pratique et options, hors théories)<br><small>UT par jour de fin : </small>${finTxt(all)}</div>`}
function tabCompact(f,l,ut,b){const jr=SJ();
 return `<div class="tw"><table class="fam cp" style="--fc:${FC[f]}">${CG}<tr><th>Stagiaire</th><th>Entreprise</th><th>Fam.</th><th>Catégories</th><th>Début</th><th>Fin</th><th>UT</th><th class="np"></th></tr>`+l.map(s=>{const ap=aPlanifier(s,jr);
  return `<tr><td><b>${esc(s.prenom)} ${esc(s.nom)}</b>${ap?` <span class="warn">${ap}</span>`:''}</td><td>${esc(s.entreprise||'—')}</td><td>${f}</td><td>${(s.categories||[]).join(', ')||'—'}</td><td onclick="editSt('${s.id}')" style="cursor:pointer">${frc(s.date_debut)}</td><td onclick="editSt('${s.id}')" style="cursor:pointer">${frc(s.date_fin)}</td><td><b>${utTxt(s)}</b></td><td class="np"><button class="sec" onclick="editSt('${s.id}')">✎</button><button class="del" onclick="supSt('${s.id}')">✕</button></td></tr>`}).join('')+`<tr class="tot"><td colspan="6">Total ${f} (pratique)</td><td>${fmt(ut)}</td><td class="np"></td></tr><tr class="tot2"><td colspan="7">UT par jour de fin : ${finTxt(b)}</td><td class="np"></td></tr></table></div>`}
// ---- Suppression : un stagiaire, ou tous ceux d'une famille (semaine affichée) ; ils sont aussi retirés de tous les créneaux du planning ----
async function delSt(ids){if(!ids.length)return;
 await ok(sb.from('creneau_stagiaires').delete().in('stagiaire_id',ids));
 await ok(sb.from('stagiaire_options').delete().in('stagiaire_id',ids));
 await ok(sb.from('stagiaires').delete().in('id',ids));charger()}
async function supSt(id){const s=D.st.find(x=>x.id==id);if(!s)return;
 const n=D.cr.filter(c=>inCr(c,id)).length;
 if(confirm(`Supprimer ${s.prenom} ${s.nom} ?`+(n?`\nIl sera aussi retiré de ${n} créneau(x) du planning.`:'')))delSt([id])}
async function viderFam(f){const l=semSt(f),ids=l.map(x=>x.id);if(!ids.length)return;
 const n=D.cr.filter(c=>c.creneau_stagiaires.some(x=>ids.includes(x.stagiaire_id))).length;
 if(confirm(`SUPPRIMER LES ${l.length} STAGIAIRES ${f} affichés cette semaine (du ${frc(S.lundi)} au ${frc(add(S.lundi,4))}) ?\n\nIls seront aussi retirés de ${n} créneau(x) du planning. Les créneaux restent (vides). Action définitive.`)&&confirm(`Dernière confirmation : supprimer ${l.length} stagiaire(s) ${f} ?`))delSt(ids)}
// Onglet d'une famille : ▶ début, ■ fin, Form./Test/F+T = activité du jour, abs. = absent. Clic sur un jour = menu.
function tabFam(f){const jr=SJ(),l=semSt(f);
 if(!l.length)return '<small>Aucun stagiaire cette semaine.</small>';
 let tot=0;
 return `<p><button class="del np" onclick="viderFam('${f}')">Vider tous les stagiaires ${f} (${l.length})</button></p><div class="tw"><table class="fam" style="--fc:${FC[f]}"><tr><th>Stagiaire</th><th>Employeur</th><th>Catégories</th><th>Début</th><th>Fin</th><th>UT</th>${JN.map(j=>`<th>${j}</th>`).join('')}<th class="np"></th></tr>`+l.map(s=>{const ap=aPlanifier(s,jr);if(isTest(s))tot+=utPrat(s);
  return `<tr><td><b>${s.prenom} ${s.nom}</b>${ap?` <span class="warn">${ap}</span>`:''}</td><td>${s.entreprise||'—'}</td><td>${(s.categories||[]).join(', ')||'—'}</td><td>${frc(s.date_debut)}</td><td>${frc(s.date_fin)}</td><td><b>${utTxt(s)}</b></td>`+
  jr.map(d=>{const p=dEnPlace(s,d),dans=s.date_debut&&d>=s.date_debut&&(!s.date_fin||d<=s.date_fin);
   return `<td class="j ${p?'on':''}" onclick="menuJour('${s.id}','${d}')">${s.date_debut==d?'▶ ':''}${p?abr(dayType(s,d)):dans?'abs.':'·'}${s.date_fin==d?' ■':''}</td>`}).join('')+
  `<td class="np"><button class="sec" onclick="editSt('${s.id}')">✎</button><button class="del" onclick="supSt('${s.id}')">✕</button></td></tr>`}).join('')+`<tr class="tot"><td colspan="5">Total UT pratique (hors théories)</td><td>${fmt(tot)}</td><td colspan="5"></td><td class="np"></td></tr></table></div>`}
function menuJour(id,d){const s=D.st.find(x=>x.id==id),b=(l,fn,c)=>`<button class="${c||''}" style="width:100%" onclick="${fn};$('pop').hidden=true">${l}</button>`;
 $('pop').hidden=false;$('pop').innerHTML=`<div class="pb"><h3>${s.prenom} ${s.nom} — ${d.split('-').reverse().slice(0,2).join('/')}</h3>`+
  [['Formation','Formation'],['Test','Test'],['Les deux','Formation + Test']].map(([v,l])=>b(l,`jour('${id}','${d}','${v}')`)).join('')+
  b('Absent ce jour',`jour('${id}','${d}','Absent')`,'sec')+b('▶ Début ici',`debutFin('${id}','date_debut','${d}')`,'sec')+b('■ Fin ici',`debutFin('${id}','date_fin','${d}')`,'sec')+
  `<button class="sec" style="width:100%" onclick="$('pop').hidden=true">Fermer</button></div>`}
function jour(id,d,v){const s=D.st.find(x=>x.id==id),r={programme:{...(s.programme||{}),[d]:v}};
 if(!s.date_debut||d<s.date_debut)r.date_debut=d;          // choisir un jour étend la période si besoin
 if(s.date_fin&&d>s.date_fin&&v!='Absent')r.date_fin=d;upd('stagiaires',id,r)}
function debutFin(id,k,d){upd('stagiaires',id,{[k]:d})}
function imprimerStag(){const fr=d=>d.split('-').reverse().join('/');
 $('pz').innerHTML=`<h1>Stagiaires – semaine du ${fr(S.lundi)} au ${fr(add(S.lundi,4))}</h1>`+(S.fam=='Globale'?tabGlobale():`<h3>${S.fam}</h3>`+tabFam(S.fam));window.print()}
function editSt(id,fam){const s=D.st.find(x=>x.id==id)||{famille:fam,categories:[],type:'Formation'};S.es=id;S.sc=s.categories||[];S.so=new Set(D.so.filter(o=>o.stagiaire_id==id).map(o=>o.categorie+'|'+o.option_id));
 $('sf').hidden=false;$('sf').innerHTML=`<h3>${id?'Modifier':'Nouveau'} stagiaire</h3><div class="grid"><input id="sn" placeholder="Nom" value="${s.nom||''}"><input id="sp" placeholder="Prénom" value="${s.prenom||''}"><input id="se" placeholder="Entreprise" value="${s.entreprise||''}">
 <select id="sfa" onchange="S.sc=[];catsSt()">${FAM.map(r=>`<option ${r==s.famille?'selected':''}>${r}</option>`).join('')}</select>
 <select id="sty">${['Formation','Test','Les deux'].map(t=>`<option ${t==s.type?'selected':''}>${t}</option>`).join('')}</select>
 <label>Début <input type="date" id="sd" value="${s.date_debut||''}"></label><label>Fin <input type="date" id="sfi" value="${s.date_fin||''}"></label></div><div id="sc"></div><div id="so"></div>
 <button onclick="saveSt()">Enregistrer</button><button class="sec" onclick="$('sf').hidden=true">Annuler</button>`;catsSt();$('sf').scrollIntoView()}
function catsSt(){setTimeout(optsSt,0);const l=D.cat.filter(c=>c.famille==$('sfa').value);$('sc').innerHTML=l.length?'Catégories : '+l.map(c=>`<label class="k"><input type="checkbox" class="sc" onchange="optsSt()" value="${c.nom}" ${S.sc.includes(c.nom)?'checked':''}> ${c.nom}</label>`).join(''):'<small>Pas de sous-catégorie.</small>'}
function optsSt(){if(!$('so'))return;document.querySelectorAll('.so').forEach(x=>x.checked?S.so.add(x.value):S.so.delete(x.value));

   if(!dEnPlace(s,d))return '<td class="off">·</td>';
   const cs=D.cr.filter(c=>c.jour==d&&inCr(c,s.id)),mq=dayType(s,d)!='Formation'?manqueTest(s):'à planifier Form.';
   return '<td>'+cs.map(c=>`<div class="mini" onclick="editCr('${c.id}')">${c.debut.slice(0,5)}–${c.fin.slice(0,5)}<br>${typeB(c)}${estPr(c)?` · ${fmt(+(c.creneau_stagiaires.find(z=>z.stagiaire_id==s.id)||{}).ut_prat||0)} UT`:''}<br>${nomF(c)}<br><button class="del" style="min-height:26px;padding:1px 8px" onclick="event.stopPropagation();retirer('${c.id}','${s.id}')">✕ Retirer</button></div>`).join('')+(!cs.length&&mq?`<span class="warn">${mq}</span><br>`:'')+`<button class="sec" onclick="nouvCr('${s.id}','${d}')">+</button></td>`}).join('')+'</tr>'}).join('')+'</table></div>'}
// Groupe : tous les stagiaires de la famille présents ce jour sont cochés d'un coup (on en décoche au besoin ; changer Formation/Test puis « Tout cocher » ajuste la liste)
const selAll=v=>{document.querySelectorAll('.cs').forEach(x=>x.checked=v);majFin('auto')};
function nouvGrp(f,d){formCr();$('cj').value=d;$('cfa').value=f;
 const pr=D.st.filter(s=>s.famille==f&&dEnPlace(s,d)),n=t=>pr.filter(s=>dayType(s,d)==t).length,t=n('Test')>n('Formation')?'Test':'Formation';
 $('cef').checked=t=='Formation';$('cet').checked=t=='Test';$('cnt').value='Pratique';S.sel=[];S.cc='';raf(1,1);selAll(true);majFin('hint');$('fc').scrollIntoView()}
function nouvCr(sid,d){const s=D.st.find(x=>x.id==sid);formCr();$('cj').value=d;$('cfa').value=s.famille;
 const t=dayType(s,d),th=D.cr.some(c=>estTh(c)&&inCr(c,s.id)),m=catsSansPratique(s);
 $('cef').checked=t!='Test';$('cet').checked=t!='Formation';if($('cet').checked&&!$('cef').checked){$('cnt').value='Pratique'}
 S.sel=[sid];S.cc=$('cet').checked&&!$('cef').checked&&th&&m[0]?m[0]:'';raf(1,1);majFin('auto');$('fc').scrollIntoView()}   // type modifiable ; pour un test, la catégorie sans pratique est proposée d'abord

// ---- Impression (noir et blanc : cadres et libellés, aucune information portée par la couleur) ----
const tabPrint=l=>`<table style="width:100%"><tr><th>Heure</th><th>Famille</th><th>Type</th><th>Formateur</th><th>Salle</th><th>Stagiaires</th><th>Consigne</th></tr>`+l.map(c=>`<tr><td>${c.debut.slice(0,5)}–${c.fin.slice(0,5)}</td><td>${c.famille}${c.categorie?' '+c.categorie:''}</td><td>${typeB(c)}</td><td>${(D.f.find(x=>x.id==c.formateur_id)||{}).nom||'à affecter'}</td><td>${c.salle_id?(D.sa.find(x=>x.id==c.salle_id)||{}).nom:'—'}</td><td>${c.creneau_stagiaires.map(x=>nomSt(x.stagiaire_id)).join(', ')}</td><td>${esc(c.consigne||'')}</td></tr>`).join('')+'</table>';
function imprimer(f){  // f='' : global ; 'tous' : une page par formateur ; sinon un formateur
 const fr=d=>d.split('-').reverse().join('/'),sem=`Semaine du ${fr(S.lundi)} au ${fr(add(S.lundi,4))}`;
 const page=(t,id)=>`<section style="page-break-after:always"><h1>${t}</h1><h3>${sem}</h3>`+JN.map((j,i)=>{const d=add(S.lundi,i),l=D.cr.filter(c=>c.jour==d&&(!id||c.formateur_id==id));
  return `<h4>${j} ${d.slice(8)}/${d.slice(5,7)}</h4>`+(l.length?tabPrint(l):'<p>Aucun créneau.</p>')}).join('')+'</section>';
 $('pz').innerHTML=f==''?page('Planning global',''):f=='tous'?D.f.map(x=>page('Planning – '+x.nom,x.id)).join(''):page('Planning – '+D.f.find(x=>x.id==f).nom,f);
 window.print()}

// ---- Temps réel multi-postes : si un formulaire est ouvert, on prévient au lieu d'écraser la saisie ----
let tm;sb.channel('adm').on('postgres_changes',{event:'*',schema:'public',table:'signal'},()=>{if(!D.p)return;clearTimeout(tm);tm=setTimeout(()=>{
 const a=document.activeElement,saisie=a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.closest('#fc,#sf'),sf=$('sf');
 if(S.edit||saisie||(sf&&!sf.hidden)){const b=$('ban');if(b)b.hidden=false}else charger()},400)}).subscribe();
init();
</script></body></html>
